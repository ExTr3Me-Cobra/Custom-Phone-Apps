name: Build Web Shortcuts APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install it as an update.
      # The key is the repository secret WEBSHORTCUTS_KEYSTORE; a build never makes one.
      - name: Signing key from the secret
        env:
          KEYSTORE_B64: ${{ secrets.WEBSHORTCUTS_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::The WEBSHORTCUTS_KEYSTORE secret is missing."; exit 1; }
          mkdir -p signing && echo "$KEYSTORE_B64" | base64 -d > signing/webshortcuts.keystore
          keytool -list -v -keystore signing/webshortcuts.keystore -storepass android | grep SHA256

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PsignKeystore=$PWD/signing/webshortcuts.keystore
          cp app/build/outputs/apk/release/app-release.apk WebShortcuts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WebShortcuts-apk
          path: WebShortcuts.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-shortcuts-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Web Shortcuts (build ${{ github.run_number }})
          body: |
            On your phone, tap **WebShortcuts.apk** below to download it, then open it to install.
            See the README on the claude/web-shortcuts-app branch for setup steps.
          files: WebShortcuts.apk
          make_latest: false
