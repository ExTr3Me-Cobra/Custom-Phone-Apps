name: Build Mammy Frame for Windows

# Only when the Windows version (or the AI model / font it shares with Android) changes.
on:
  push:
    paths:
      - 'windows/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/res/font/**'
      - '.github/workflows/build-mammy-frame-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mammy-frame-windows-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the installer and the no-install version
        working-directory: windows
        run: ./gradlew.bat packageMsi createDistributable --stacktrace

      - name: Collect the downloads
        shell: pwsh
        run: |
          $msi = Get-ChildItem "windows/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "MammyFrame-Windows-Setup.msi"
          Compress-Archive -Path "windows/build/compose/binaries/main/app/Mammy Frame" -DestinationPath "MammyFrame-Windows.zip"
          Get-ChildItem MammyFrame-Windows*

      - uses: actions/upload-artifact@v4
        with:
          name: MammyFrame-Windows
          path: |
            MammyFrame-Windows-Setup.msi
            MammyFrame-Windows.zip

      # Real Windows test: install from the installer, open the installed app in its automatic test
      # mode (every screen, a real click, Ai Rotate on test photos, screenshots), and check it passed.
      - name: Test the installed app on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "mammyframe-test"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $install = Start-Process msiexec.exe -ArgumentList "/i", "MammyFrame-Windows-Setup.msi", "/qn", "/L*v", "$out\install.log" -Wait -PassThru
          "Installer finished with code $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "The installer failed (code $($install.ExitCode))" }
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter "Mammy Frame.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed Mammy Frame.exe not found" }
          "Installed at $($exe.FullName)"
          # Also prove an AI crash is survived: the AI helper is told to crash on one test photo.
          $env:MAMMYFRAME_TEST_CRASH_ON = "p12.jpg"
          $app = Start-Process -FilePath $exe.FullName -ArgumentList "--autotest", "$out", "$env:GITHUB_WORKSPACE\windows\testdata" -PassThru
          if (-not $app.WaitForExit(540000)) { $app.Kill(); "The app didn't finish in time" }
          "App finished with code $($app.ExitCode)"
          $log = "$env:APPDATA\MammyFrame\log.txt"
          if (Test-Path $log) { Copy-Item $log "$out\log.txt"; Get-Content $log -Tail 150 } else { "No log was written" }
          if (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern "AUTOTEST PASSED" -Quiet))) { throw "The Windows test did not pass" }

      # The test's screenshots and logs, kept even if it failed (a separate pre-release, not for installing).
      - name: Keep the test results
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "mammyframe-test"
          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          Get-ChildItem $out -File -ErrorAction SilentlyContinue | Copy-Item -Destination "test-results"
          Get-ChildItem "test-results"

      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: mammy-frame-windows-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mammy Frame for Windows - test results (build ${{ github.run_number }})
          body: Screenshots and logs from the automatic Windows test. Not for installing.
          prerelease: true
          make_latest: false
          files: test-results/*

      - name: Publish downloads on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mammy-frame-windows-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mammy Frame for Windows (build ${{ github.run_number }})
          body: |
            **MammyFrame-Windows-Setup.msi**: download and open it to install (no administrator needed).
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            **MammyFrame-Windows.zip**: no install. Unzip it anywhere and open **Mammy Frame.exe**.
          files: |
            MammyFrame-Windows-Setup.msi
            MammyFrame-Windows.zip
          make_latest: false
