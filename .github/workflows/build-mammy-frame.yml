name: Build Mammy Frame APK

on:
  push:
    # The Windows version has its own build.
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/build-mammy-frame-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so every build signs with the same saved key.
concurrency:
  group: mammy-frame-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the same key, the repository secret MAMMYFRAME_KEYSTORE, so new
      # versions install over the old one. Without it the build stops (a new key would stop updates).
      - name: Signing key from the secret
        env:
          KEYSTORE_B64: ${{ secrets.MAMMYFRAME_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No signing key. Save it as the repository secret MAMMYFRAME_KEYSTORE (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/mammyframe.keystore
          keytool -list -v -keystore signing/mammyframe.keystore -storepass android | grep SHA256

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PsignKeystore=$PWD/signing/mammyframe.keystore
          cp app/build/outputs/apk/release/app-release.apk MammyFrame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MammyFrame-apk
          path: MammyFrame.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mammy-frame-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mammy Frame (build ${{ github.run_number }})
          body: |
            On your phone, tap **MammyFrame.apk** below to download it, then open it to install.
            See the README on the claude/mammy-frame-app branch for setup steps.
          files: MammyFrame.apk
          make_latest: false
