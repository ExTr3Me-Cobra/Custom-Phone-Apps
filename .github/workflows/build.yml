name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Android API level the app compiles against (see app/build.gradle.kts).
  ANDROID_PLATFORM: "platforms;android-37.2"
  ANDROID_BUILD_TOOLS: "build-tools;37.0.0"

# Three jobs: the APK and the tests build side by side, and the APK is published once both have
# passed (so a broken build is never offered for download).
jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null

      # The build cache is also saved from this branch (by default only the default branch saves it).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests (and compile the instrumented benchmark)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      - name: Benchmark result
        if: always()
        run: |
          grep -ho 'BENCHMARK[^<]*' core/build/test-results/test/*.xml >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests

  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Sign with the app's own key when the LABELRESCUE_KEYSTORE secret is set (pushes only; pull
      # requests from forks don't get secrets), so each build updates the installed app.
      - name: Build debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LABELRESCUE_KEYSTORE }}
        run: |
          # One secret, LABELRESCUE_KEYSTORE: the keystore file, base64. Like the other apps in
          # this repo, its password is the fixed "android" and the key is named "labelrescue":
          # the keystore file itself is what's kept secret.
          export LABELRESCUE_KEYSTORE_PASSWORD=android LABELRESCUE_KEY_PASSWORD=android LABELRESCUE_KEY_ALIAS=labelrescue
          echo "LABELRESCUE_KEYSTORE secret visible to this build: $([ -n "$KEYSTORE_BASE64" ] && echo yes || echo NO)"
          if [ -n "$KEYSTORE_BASE64" ]; then
            export LABELRESCUE_KEYSTORE_FILE="$RUNNER_TEMP/app.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$LABELRESCUE_KEYSTORE_FILE"
            if ! keytool -list -keystore "$LABELRESCUE_KEYSTORE_FILE" -storepass android -alias labelrescue > /dev/null 2>&1; then
              echo "::error title=LABELRESCUE_KEYSTORE doesn't open::The secret isn't a keystore with password 'android' and key 'labelrescue'. Paste the LABELRESCUE_KEYSTORE.txt contents from the README setup. This build uses the throwaway debug key."
              rm -f "$LABELRESCUE_KEYSTORE_FILE"; unset LABELRESCUE_KEYSTORE_FILE
            fi
            echo "Signed with the app's own key: installs as an update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Debug key::Signing secrets not set: this APK uses a throwaway key, so installing it needs an uninstall first."
          fi
          ./gradlew --stacktrace :app:assembleDebug
          rm -f "$RUNNER_TEMP/app.keystore"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LabelRescue.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/LabelRescue.apk | grep -i "SHA-256" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: LabelRescue-debug-apk
          path: out/LabelRescue.apk
          if-no-files-found: error

  # A direct download link (Releases page), like the repo's other apps. Not for pull requests.
  publish:
    name: Publish the APK
    needs: [tests, debug]
    # Also when started by hand (the training workflow does that after committing new models).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LabelRescue-debug-apk
          path: out

      - name: Publish the APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: label-rescue-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Label Rescue (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Debug build of `${{ github.ref_name }}` at ${{ github.sha }}. On your phone, tap
            **LabelRescue.apk** below to download it, then open it to install.
          files: out/LabelRescue.apk

  # The minified release APK + AAB (for a store, someday) only when started by hand: the
  # downloadable debug APK above is signed with the same key and is what gets installed.
  release:
    name: Signed release APK + AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.LABELRESCUE_KEYSTORE }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release signing skipped::Add the LABELRESCUE_KEYSTORE repository secret (Settings > Secrets and variables > Actions > Secrets) to build a signed release (see README)."
            echo "Release signing secrets are not set, so the signed release was skipped. The debug APK is in the other job." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        if: steps.secrets.outputs.ready == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Build signed APK and AAB
        if: steps.secrets.outputs.ready == 'true'
        run: |
          export LABELRESCUE_KEYSTORE_PASSWORD=android LABELRESCUE_KEY_PASSWORD=android LABELRESCUE_KEY_ALIAS=labelrescue
          export LABELRESCUE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$LABELRESCUE_KEYSTORE_FILE"
          ./gradlew --stacktrace :app:assembleRelease :app:bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LabelRescue-release.apk
          cp app/build/outputs/bundle/release/app-release.aab out/LabelRescue-release.aab
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/LabelRescue-release.apk | grep -i "SHA-256" || true
          rm -f "$LABELRESCUE_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: LabelRescue-release
          path: out/
          if-no-files-found: error
