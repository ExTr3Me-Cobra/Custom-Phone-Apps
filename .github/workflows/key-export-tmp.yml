name: Export signing key (encrypted)
# Clean-up step: deletes the temporary release (this file is removed right after).
on:
  push:
    paths:
      - '.github/workflows/key-export-tmp.yml'
permissions:
  contents: write
jobs:
  vipervision:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release delete vipervision-key-transfer --repo "${{ github.repository }}" --yes --cleanup-tag
